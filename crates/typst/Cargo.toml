[package]
name = "ghostwrite-typst"
description = "Typst compiled in-process: a file's pages, live as it's typed, each glyph knowing the source it came from, and pages drawn."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
comemo = "0.5"
parking_lot = "0.12"
typst = "0.15.1"
typst-kit = { version = "0.15.1", features = ["datetime", "embedded-fonts", "scan-fonts", "system-downloader", "system-files"] }
typst-layout = "0.15.1"
typst-render = "0.15.1"
