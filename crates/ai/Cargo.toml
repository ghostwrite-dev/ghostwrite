[package]
name = "ghostwrite-ai"
description = "The model in the editor: prompts and context, reply parsing, backends, and the review story."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ghostwrite-project.workspace = true
base64.workspace = true
image = { workspace = true, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
regex.workspace = true
resvg = "0.47"
serde_json.workspace = true
ureq.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
