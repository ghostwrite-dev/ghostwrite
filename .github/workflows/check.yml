name: check
on:
  push:
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add wasm32-wasip2
      - name: Install what macOS needs
        if: runner.os == 'macOS'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake
      - name: Install what Linux needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libvulkan-dev libxkbcommon-x11-dev libwayland-dev libfontconfig-dev libssl-dev mesa-vulkan-drivers xvfb
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: ./check.sh
        shell: bash
