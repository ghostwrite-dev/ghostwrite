[package]
name = "ghostwrite"
description = "Ghostwrite: a helix-style editor with stepwise AI stories."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ghostwrite-ai.workspace = true
ghostwrite-model.workspace = true
ghostwrite-core.workspace = true
ghostwrite-lsp.workspace = true
ghostwrite-dap.workspace = true
ghostwrite-page.workspace = true
ghostwrite-project.workspace = true
ghostwrite-terminal.workspace = true
ghostwrite-plugin.workspace = true
ghostwrite-state.workspace = true
ghostwrite-wasm = { workspace = true, optional = true }

futures.workspace = true
gpui.workspace = true
image.workspace = true
nucleo-matcher.workspace = true
regex.workspace = true
ureq.workspace = true
serde_json.workspace = true
unicode-width.workspace = true

[features]
default = ["local-models", "wasm-plugins"]
local-models = ["ghostwrite-model/llama"]
wasm-plugins = ["dep:ghostwrite-wasm"]

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
