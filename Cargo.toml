# Ghostwrite: a helix-style editor with stepwise Claude stories.
#
# Layered like helix (and zed): pure crates at the bottom, the gpui app on
# top. Nothing below `app` knows about the UI.
#
#   core     text (a rope), selections, motions, text objects, modal keys, syntax over any grammar
#   project  files, search, file operations, persisted state
#   terminal the user's shell, emulated: its screen, to draw and to read
#   page     what a document's pages are: their sizes, pages drawn
#   plugin   what a plugin can add, the plugins there are, and installing them
#   plugin-api what a plugin written in Rust compiles against, and the interface itself
#   wasm     (optional) runs plugins compiled to WebAssembly, sandboxed, and their grammars
#   lsp      language-server client (the servers are plugins')
#   model    a local model: llama.cpp, in a process of its own
#   ai       the model: prompts, reply parsing, backends, the review story
#   view     the editor's state: documents, tabs, the project, search, registers, jumps
#   app      the gpui application (binary `ghostwrite`)
[workspace]
exclude = ["examples", "plugins", "crates/wasm/tests/fixture"]
resolver = "3"
members = ["crates/core", "crates/project", "crates/terminal", "crates/page", "crates/lsp", "crates/dap", "crates/plugin", "crates/plugin-api", "crates/wasm", "crates/model", "crates/ai", "crates/view", "crates/app"]
default-members = ["crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nucleo-matcher = "0.3"
unicode-segmentation = "1"
unicode-width = "0.2"
libc = "0.2"
windows-sys = "0.61"
ghostwrite-core = { path = "crates/core" }
ghostwrite-project = { path = "crates/project" }
ghostwrite-terminal = { path = "crates/terminal" }
ghostwrite-lsp = { path = "crates/lsp" }
ghostwrite-dap = { path = "crates/dap" }
ghostwrite-page = { path = "crates/page" }
ghostwrite-wasm = { path = "crates/wasm" }
ghostwrite-plugin = { path = "crates/plugin" }
ghostwrite-model = { path = "crates/model", default-features = false }
ghostwrite-ai = { path = "crates/ai" }
ghostwrite-view = { path = "crates/view" }

alacritty_terminal = { version = "0.26", default-features = false }
futures = "0.3"
# Shaders compile at launch: building them needs the Metal toolchain.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
ignore = "0.4"
# What gpui draws images from.
image = { version = "0.25", default-features = false }
base64 = "0.22"
notify-debouncer-mini = "0.7"
lsp-types = { version = "0.97", features = ["proposed"] }
regex = "1"
encoding_rs = "0.8"
similar = "2"
serde_json = "1"
trash = "5"
# Versions tree-sitter's own `wasm` feature asks for: grammars and plugins share them.
wasmtime = { version = "48", default-features = false, features = ["cache", "component-model", "cranelift", "gc", "gc-null", "parallel-compilation", "runtime", "std"] }
wasmtime-wasi = "48"
wit-bindgen = "0.57"
ureq = { version = "3", features = ["json"] }

# Text as a rope (helix's): an edit doesn't copy what's after it. Lines are `\n` only.
ropey = { version = "1.6", default-features = false, features = ["simd"] }
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
# Only for core's own tests: the editor's grammars are plugins' (`plugins/*/grammars.txt`).
tree-sitter-rust = "0.24"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

# Compiling a plugin takes seconds optimized, and minutes not.
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.wasmparser]
opt-level = 3
