# PDFs as a plugin, built for WebAssembly: scripts/build-plugins.sh.
[package]
name = "ghostwrite-pdf-plugin"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ghostwrite-plugin-api = { path = "../../crates/plugin-api" }
wit-bindgen = "0.57"
hayro = "0.7"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[workspace]
