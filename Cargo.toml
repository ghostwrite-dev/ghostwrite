[package]
name = "ghostwrite"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
futures = "0.3"
ignore = "0.4"
trash = "5"
gpui-kit = { version = "0.7", features = [
    "tree-sitter-bash",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-typescript",
] }
lsp-types = { version = "0.97", features = ["proposed"] }
regex = "1"
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }

# A local copy of gpui-base with one addition: a "block gap" that reserves
# height after a line, so inline Claude diffs can fold out and push code down.
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
